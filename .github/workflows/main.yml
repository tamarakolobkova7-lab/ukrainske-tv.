name: Build Ukrainian TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UkrainskeTV_fixed_source.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q UkrainskeTV_fixed_source.zip -d extracted
          PROJECT_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UkrainskeTV-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
