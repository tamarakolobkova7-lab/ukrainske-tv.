{"name":"Build Ukrainian TV APK","on":{"workflow_dispatch":{},"push":{"paths":["UkrainskeTV_source.zip",".github/workflows/"]}},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"name":"Download repository","uses":"actions/checkout@v4"},{"name":"Extract Android project","shell":"bash","run":"set -e\nmkdir extracted\nunzip -q UkrainskeTV_source.zip -d extracted\nPROJECT_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)\nif [ -z "$PROJECT_FILE" ]; then echo "Cannot find settings.gradle in the ZIP archive"; exit 1; fi\necho "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV""},{"name":"Set up Java","uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"Set up Gradle","uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Build APK","shell":"bash","run":"set -e\ncd "$PROJECT_DIR"\ngradle assembleDebug"},{"name":"Save APK","uses":"actions/upload-artifact@v4","with":{"name":"UkrainskeTV-APK","path":"/build/outputs/apk/debug/*.apk","if-no-files-found":"error"}}]}}}
